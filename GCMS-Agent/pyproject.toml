[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcms-research-agent"
version = "0.1.0"
description = "Auditable GC-EI-MS candidate repair using MoleCode and Claude Harness"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "rdkit-pypi==2022.9.5",
    "numpy<2",
    "PyYAML>=6,<7",
    "Pillow>=12.1,<13",
    "claude-agent-sdk==0.2.176",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
gcms-agent = "gcms_agent.cli:main"

[tool.setuptools]
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "licenses/claude-agent-sdk-python.LICENSE",
    "skills/molecode-graph-reasoning/UPSTREAM_LICENSE.txt",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
