[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "DiffGCMS"
version = "0.2.0"
description = "DiffGCMS: GC-EI-MS graph diffusion with frozen SpecTUS encoder"
requires-python = ">=3.9"
dependencies = [
    "hydra-core>=1.3.2",
    "matplotlib>=3.7",
    "numpy>=1.23",
    "omegaconf>=2.3.0",
    "pandas>=1.4",
    "pytorch_lightning>=2.0.4",
    "torch_geometric>=2.3.1",
    "torchmetrics>=0.11.4",
    "tqdm",
    "transformers>=4.30.0",
    "wandb",
    "rdkit-pypi",
]
readme = "README.md"
license = {file = "LICENSE"}

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = []
namespaces = false
